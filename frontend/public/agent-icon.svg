<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Modern AI agent icon -->
  <defs>
    <linearGradient id="agentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main circle -->
  <circle cx="50" cy="50" r="45" fill="url(#agentGradient)" />
  
  <!-- Brain/AI symbol -->
  <path d="M30,40 Q30,30 40,30 T60,30 Q70,30 70,40 T60,50 T40,50 T30,40" fill="white" opacity="0.9" />
  
  <!-- Neural connections -->
  <path d="M40,35 L42,40 L45,42" stroke="white" stroke-width="2" opacity="0.8" />
  <path d="M60,35 L58,40 L55,42" stroke="white" stroke-width="2" opacity="0.8" />
  <path d="M45,45 L42,50 L40,52" stroke="white" stroke-width="2" opacity="0.8" />
  <path d="M55,45 L58,50 L60,52" stroke="white" stroke-width="2" opacity="0.8" />
  
  <!-- Glow effect -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="3" />
  <circle cx="50" cy="50" r="48" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
</svg>